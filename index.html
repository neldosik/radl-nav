<!doctype html>
<html lang="de" class="light-theme">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <!-- iOS versteht bei apple-touch-icon kein SVG und zeigte deshalb gar kein
         Symbol auf dem Startbildschirm. -->
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Radl Navi München — kostenlose Navigation mit MyRadl-Fahrrädern + MVV (U-Bahn, S-Bahn, Tram, Bus). 30 Freiminuten optimal nutzen." />
    <!-- Farbe der Leiste, nicht des Papiers: was iOS im Startbildschirm-Modus
         rund um die Webansicht malt, nimmt es von hier — die Fläche selbst ist
         für Stilangaben nachweislich nicht erreichbar. Unten schließt immer
         eine Leiste in Kartenfarbe ab; mit Papier setzte sich der Streifen
         darunter sichtbar ab. -->
    <meta name="theme-color" content="#fffdf8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Mit „default" gibt iOS der Webansicht im Startbildschirm-Modus nur
         Bildschirmhöhe minus Statusleiste: auf einem 13 Pro 797 statt 844,
         gemessen über `dvh` gegen `lvh`. Die fehlenden 47 px landen unten als
         Streifen, den weder ein Element noch die Leinwand des Dokuments
         erreicht — beides ausprobiert, beides wirkungslos. Erst
         „black-translucent" gibt die volle Höhe; der obere Sicherheitsabstand
         hält die Kopfzeile weiterhin frei von der Statusleiste.

         Achtung: iOS liest diese Angabe beim Ablegen auf dem Startbildschirm.
         Eine bereits abgelegte App übernimmt sie erst nach erneutem Ablegen. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RadlNavi" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- Schriften liegen im Bündel (src/fonts, siehe @font-face in index.css) —
         kein Aufruf zu fonts.googleapis.com, also auch offline und ohne
         IP-Weitergabe an Dritte. -->
    <title>Radl Navi — MyRadl + MVV</title>
    <script type="module" crossorigin src="./assets/index-COd0dgFO.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/rolldown-runtime-Bh1tDfsg.js">
    <link rel="modulepreload" crossorigin href="./assets/preload-helper-HclGiUj8.js">
    <link rel="modulepreload" crossorigin href="./assets/geolocation-71J-cQfD.js">
    <link rel="modulepreload" crossorigin href="./assets/i18n-C2AzY99i.js">
    <link rel="stylesheet" crossorigin href="./assets/index-DmZIg9Ah.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
