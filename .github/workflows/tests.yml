name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pruefen:
    name: Typen, Lint und Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typen prüfen
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Produktionsbündel bauen
        run: npm run build

      # Der Kartenteil wiegt allein rund 270 kB gzip. Rutscht er durch einen
      # beiläufigen statischen Import in den Einstieg, lädt die App am Handy
      # spürbar länger — auffallen würde das sonst niemandem.
      - name: Bündelgröße prüfen
        run: npm run size

  rauchprobe:
    name: Rauchprobe im Browser
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Browser holen
        run: npx playwright install --with-deps chromium

      - name: Bündel bauen
        run: npm run build

      # Alle fremden Dienste sind abgefangen (tests/e2e/mocks.ts): der Lauf
      # prüft die App, nicht die Verfügbarkeit von Transitous und nextbike.
      - name: Rauchprobe
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-bericht
          path: playwright-report
          retention-days: 7

  android:
    name: Android-Hülle bauen
    runs-on: ubuntu-latest

    steps:
      # Volle Historie: versionCode zählt die Commits, bei einem flachen Klon
      # käme jede APK als Version 1 heraus.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci

      # Die Hülle bekam Änderungen an Plugins und Gradle-Dateien bisher erst
      # auf dem Rechner zu sehen, auf dem jemand zufällig eine APK baute.
      - name: Webteil bauen und übertragen
        run: |
          npm run build
          npx cap sync android

      - name: Debug-APK bauen
        run: ./gradlew --no-daemon assembleDebug
        working-directory: android
