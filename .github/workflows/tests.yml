name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pruefen:
    name: Typen, Lint und Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typen prüfen
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Produktionsbündel bauen
        run: npm run build
